<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>美食選購</title>
<meta name="description" content="選好商品，按「結帳」產生訂單再傳給我">
<meta property="og:title" content="美食選購">
<meta property="og:description" content="選好商品，按「結帳」產生訂單再傳給我">
<style>
:root{--bg:#fff8ec;--card:#fff;--ink:#3a2a1a;--mute:#8a7560;--line:#e8d9bf;--accent:#d9480f;--btn:#d9480f;--btnt:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1812;--card:#2a231a;--ink:#f5e9d6;--mute:#b5a38a;--line:#46392a;--accent:#ff8a4c;--btn:#ff8a4c;--btnt:#2a1604}}
:root[data-theme="dark"]{--bg:#1d1812;--card:#2a231a;--ink:#f5e9d6;--mute:#b5a38a;--line:#46392a;--accent:#ff8a4c;--btn:#ff8a4c;--btnt:#2a1604}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
header{text-align:center;padding:24px 16px 8px}h1{margin:0;font-size:24px}header p{margin:6px 0 0;color:var(--mute);font-size:14px}
.tabs{display:flex;gap:8px;overflow-x:auto;max-width:760px;margin:12px auto 0;padding:0 14px 2px}
.tabs button{flex:none;padding:8px 16px;background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:700;border-radius:20px}
.tabs button.on{background:var(--btn);color:var(--btnt);border-color:var(--btn)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;max-width:760px;margin:16px auto;padding:0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:1/1;object-fit:contain;background:#f3f3f3}
.info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px}
.name{font-weight:700;font-size:16px}.price{color:var(--accent);font-weight:700;font-size:18px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px}
.add{background:var(--btn);color:var(--btnt);padding:9px;font-weight:700}
.qty{display:flex;align-items:center;justify-content:space-between;gap:8px}
.qty button{width:38px;height:38px;background:var(--bg);color:var(--ink);border:1px solid var(--line);font-size:20px}
.qty span{font-weight:700;min-width:24px;text-align:center}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:space-between;gap:12px}
.bar b{font-size:18px;color:var(--accent)}.bar .go{background:var(--btn);color:var(--btnt);padding:11px 20px;font-weight:700}
.bar .go:disabled{opacity:.4}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:5}
.mask.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:88%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 10px;font-size:18px}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.total{display:flex;justify-content:space-between;font-weight:700;font-size:18px;padding:12px 0}.total span:last-child{color:var(--accent)}
input,textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);margin-bottom:8px}
.acts{display:flex;gap:10px;flex-wrap:wrap}.acts>*{flex:1;min-width:140px;text-align:center;padding:12px;border-radius:10px;font-weight:700;text-decoration:none}
.line{background:#06c755;color:#fff}.copy{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.hint{color:var(--mute);font-size:13px;line-height:1.6;margin:10px 0 0}.close{background:none;color:var(--mute);width:100%;padding:10px;margin-top:6px}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:14px;display:none;z-index:9}
</style></head><body>
<header><h1>美食選購</h1><p>選好數量，按「結帳」產生訂單再傳給我</p></header>
<div class="tabs" id="tabs"></div>
<div class="grid" id="grid"></div>
<div class="bar"><div>共 <span id="cnt">0</span> 件　<b id="sum">NT$0</b></div><button class="go" id="open" disabled>結帳</button></div>
<div class="mask" id="mask"><div class="sheet">
<h2>確認訂單</h2><div id="lines"></div>
<div class="total"><span>合計</span><span id="tot"></span></div>
<input id="who" placeholder="你的名字或 LINE 暱稱"><textarea id="note" rows="2" placeholder="備註（取貨時間、地點等）"></textarea>
<div class="acts"><a class="line" id="ln" target="_blank" rel="noopener">傳到 LINE</a><button class="copy" id="cp">複製訂單</button></div>
<p class="hint">訂單傳給我之後，我會回覆確認並告知付款與取貨方式。這裡不會直接扣款。</p>
<button class="close" id="cl">繼續選購</button></div></div>
<div class="toast" id="toast">已複製訂單</div>

var C={};
var CAT={13:"冷凍",12:"冷凍",11:"冷凍",10:"乳品",0:"水餃",1:"水餃",2:"水餃",3:"水餃",4:"料理包",5:"料理包",6:"飲料",7:"飲料",8:"飲料",9:"飲料"};
var TABS=["全部","水餃","料理包","冷凍","飲料","乳品"],cat="全部";
function $(s){return document.getElementById(s)}
function draw(){
  $("tabs").innerHTML=TABS.map(function(t){return '<button data-cat="'+t+'"'+(t===cat?' class="on"':'')+'>'+t+'</button>'}).join("");
  $("grid").innerHTML=P.filter(function(x){return cat==="全部"||CAT[x.id]===cat}).map(function(x){var q=C[x.id]||0;
    return '<div class="card"><img src="'+x.i+'" alt="'+x.n+'"><div class="info"><div class="name">'+x.n+'</div><div class="price">NT$'+x.p+'</div>'+
    (q?'<div class="qty"><button data-d="-1" data-id="'+x.id+'">−</button><span>'+q+'</span><button data-d="1" data-id="'+x.id+'">+</button></div>'
      :'<button class="add" data-d="1" data-id="'+x.id+'">加入購物車</button>')+'</div></div>'}).join("");
  var n=0,s=0;P.forEach(function(x){var q=C[x.id]||0;n+=q;s+=q*x.p});
  $("cnt").textContent=n;$("sum").textContent="NT$"+s;$("open").disabled=!n;return s}
function text(){
  var t="【訂單】\n",s=0;
  P.forEach(function(x){var q=C[x.id]||0;if(q){t+=x.n+" ×"+q+"　NT$"+(q*x.p)+"\n";s+=q*x.p}});
  t+="合計：NT$"+s+"\n";
  if($("who").value.trim())t+="姓名："+$("who").value.trim()+"\n";
  if($("note").value.trim())t+="備註："+$("note").value.trim()+"\n";
  return t}
function sheet(){
  var s=0;$("lines").innerHTML=P.filter(function(x){return C[x.id]}).map(function(x){s+=C[x.id]*x.p;
    return '<div class="row"><span>'+x.n+' ×'+C[x.id]+'</span><span>NT$'+C[x.id]*x.p+'</span></div>'}).join("");
  $("tot").textContent="NT$"+s;$("ln").href="https://line.me/R/msg/text/?"+encodeURIComponent(text())}
document.addEventListener("click",function(e){var b=e.target.closest("button[data-id]");
  if(b){var id=b.dataset.id;C[id]=Math.max(0,(C[id]||0)+Number(b.dataset.d));draw();return}});
document.addEventListener("click",function(e){var t=e.target.closest("button[data-cat]");if(t){cat=t.dataset.cat;draw()}});
$("open").onclick=function(){sheet();$("mask").classList.add("on")};
$("cl").onclick=function(){$("mask").classList.remove("on")};
$("who").oninput=$("note").oninput=sheet;
$("cp").onclick=function(){var t=text(),ok=function(){var o=$("toast");o.style.display="block";setTimeout(function(){o.style.display="none"},1500)};
  try{navigator.clipboard.writeText(t).then(ok,fb)}catch(e){fb()}
  function fb(){var a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");ok()}catch(e){}a.remove()}};
draw();
</script></body></html>
